    <script>
      ;(function () {
        try {
          var theme = window.localStorage.getItem('media.theme.v1') === 'light'
            ? 'light'
            : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          if (theme === 'light') {
            document.querySelector('meta[name="theme-color"]').content = '#fbfbfb'
          }
        } catch (error) {
          /* localStorage may be unavailable */
        }
      })()
    </script>

    <script>
      ;(function () {
        try {
          var redirect = sessionStorage.getItem('spa:redirect')
          if (redirect !== null) {

            window.history.replaceState(null, '', base + '/' + redirect)
          }
